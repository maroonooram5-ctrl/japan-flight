<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본 최저 항공권 검색</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<div class="container">

    <header>
        <h1>🇯🇵 일본 최저 항공권 검색</h1>
        <p>국내 LCC 특가를 한 번에 검색</p>
    </header>

    <section class="search-box">

        <div class="field">
            <label>출발 공항</label>

            <select id="departure">
                <option value="ALL">전체</option>
                <option value="ICN">ICN(인천)</option>
                <option value="GMP">GMP(김포)</option>
                <option value="CJJ">CJJ(청주)</option>
                <option value="TAE">TAE(대구)</option>
                <option value="PUS">PUS(부산)</option>
            </select>
        </div>

        <div class="field">
            <label>도착 지역</label>

            <select id="region">
                <option value="ALL">일본 전체</option>
                <option value="홋카이도">홋카이도</option>
                <option value="간토">간토</option>
                <option value="주부">주부</option>
                <option value="간사이">간사이</option>
                <option value="주고쿠">주고쿠</option>
                <option value="시코쿠">시코쿠</option>
                <option value="큐슈">큐슈</option>
                <option value="오키나와">오키나와</option>
            </select>
        </div>

        <div class="field">
            <label>도착 공항</label>

            <select id="airport"></select>
        </div>

        <div class="field">
            <label>검색 방식</label>

            <select id="tripType">
                <option value="round">왕복만</option>
                <option value="openjaw" selected>왕복 + 오픈조</option>
            </select>
        </div>

        <div id="returnAirportBox">

            <div class="field">
                <label>귀국 공항(오픈조)</label>

                <select id="returnAirport"></select>
            </div>

        </div>

        <div class="field">
            <label>출발일</label>
            <input type="date" id="departDate">
        </div>

        <div class="field">
            <label>귀국일</label>
            <input type="date" id="returnDate">
        </div>

        <div class="field">
            <label>가격</label>

            <select id="price">
                <option value="999999">전체</option>
                <option value="200000">20만원 이하</option>
                <option value="300000" selected>30만원 이하</option>
            </select>
        </div>

        <button id="searchBtn">
            검색
        </button>

    </section>

    <section id="results"></section>

</div>

</body>
</html>
